[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dronecv"
description = "Long-Range Flying Object Detection and Tracking"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Dmytro Hrynevych", email = "tol1306@gmail.com"},
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.19.0,<2.0.0",
    "opencv-contrib-python>=4.8.0,<4.9.0",
    "opencv-python>=4.8.0,<4.9.0",
    "pathlib>=1.0.1",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pylint>=2.17.0",
    "black>=23.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pylint.messages_control]
disable = ["C0111", "C0103"] 